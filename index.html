<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Slay the Spire 2 Guide — Best Builds & Strategy | STS2Guides</title>
<script>
(function(){
  var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  var zh = /^zh|^zh-cn|^zh-tw|^zh-hk/.test(lang);
  var redirect = zh ? '/zh/' : '/en/';
  window.location.replace(redirect);
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0d0d1a;
    color: #e8e6dc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .splash a {
    display: inline-block;
    margin: 12px;
    padding: 12px 32px;
    border: 1px solid #d4a03c;
    border-radius: 6px;
    color: #d4a03c;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: all .2s;
  }
  .splash a:hover { background: #d4a03c; color: #111; }
  .splash p { color: #686450; font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="splash">
    <p style="font-size:24px;color:#f0c860;margin-bottom:12px;">🗡️ STS2Guides</p>
    <a href="/en/">🇺🇸 English</a>
    <a href="/zh/">🇨🇳 中文</a>
    <p>Redirecting based on your browser language…</p>
  </div>
</body>
</html>
